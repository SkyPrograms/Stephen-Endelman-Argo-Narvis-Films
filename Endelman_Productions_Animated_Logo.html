<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Endelman Productions — Animated Logo</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(95vw,1050px);padding:35px 10px;text-align:center}svg{width:100%;height:auto;display:block}.word{font-family:Arial,Helvetica,sans-serif;font-weight:300;letter-spacing:17px;fill:#071627}.sub{font-family:Arial,Helvetica,sans-serif;font-weight:300;letter-spacing:12px;fill:#587184}.caption{font-size:13px;color:#6b7a87;margin-top:20px}button{border:1px solid #bdc7ce;border-radius:25px;background:white;color:#243748;padding:9px 18px;cursor:pointer}button:hover{background:#f3f6f8}@media(max-width:600px){.word{letter-spacing:10px}.sub{letter-spacing:7px}}@media(prefers-reduced-motion:reduce){.moving{animation-play-state:paused!important}}
</style></head><body><main class="wrap">
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Endelman Productions logo with a golden light travelling left to right across an audio waveform">
<defs>
<linearGradient id="base" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#446b80"/><stop offset="0.55" stop-color="#061b2d"/><stop offset="1" stop-color="#b7c8d0" stop-opacity=".15"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#e3a34a" stop-opacity="0"/><stop offset=".3" stop-color="#e3a34a" stop-opacity=".22"/><stop offset=".48" stop-color="#f9c979" stop-opacity=".85"/><stop offset=".5" stop-color="#fff1c9"/><stop offset=".52" stop-color="#f9c979" stop-opacity=".85"/><stop offset=".7" stop-color="#e3a34a" stop-opacity=".22"/><stop offset="1" stop-color="#e3a34a" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-150%" width="220%" height="400%"><feGaussianBlur stdDeviation="9"/></filter>
<clipPath id="bars"></clipPath>
</defs>
<g id="wave"></g>
<g clip-path="url(#bars)">
<rect x="0" y="80" width="1000" height="220" fill="url(#shine)" opacity=".75" class="moving"><animate attributeName="x" from="-1000" to="1000" dur="5s" repeatCount="indefinite"/></rect>
<rect x="0" y="80" width="260" height="220" fill="url(#shine)" filter="url(#glow)" opacity=".75" class="moving"><animate attributeName="x" from="-300" to="1000" dur="5s" repeatCount="indefinite"/></rect>
</g>
<text x="500" y="390" text-anchor="middle" font-size="76" textLength="770" lengthAdjust="spacing" class="word">ENDELMAN</text>
<path d="M160 445H260 M740 445H840" stroke="#7892a2" stroke-width="2"/>
<text x="500" y="455" text-anchor="middle" font-size="36" textLength="435" lengthAdjust="spacing" class="sub">PRODUCTIONS</text>
</svg>
<p class="caption">Animated concept • The light travels from left to right through the sound wave.</p>
<button id="toggle" type="button">Pause animation</button>
</main><script>
const ns='http://www.w3.org/2000/svg',g=document.querySelector('#wave'),clip=document.querySelector('#bars');
// Fixed irregular peaks produce a recognisable audio waveform rather than a symmetrical equalizer.
const levels=[3,4,5,7,9,12,16,21,27,20,31,25,39,52,34,45,67,99,125,85,62,46,32,55,40,76,61,48,93,120,154,111,72,142,174,130,102,156,116,83,65,45,76,58,90,118,78,53,38,29,41,58,47,32,26,20,15,11,8,5,3];
levels.forEach((h,i)=>{const x=45+i*15.15,w=7, y=200-h/2;const r=document.createElementNS(ns,'rect');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('fill','url(#base)');g.appendChild(r);const c=r.cloneNode();c.removeAttribute('fill');clip.appendChild(c);});
const button=document.querySelector('#toggle');let paused=false;button.addEventListener('click',()=>{paused=!paused;document.querySelector('svg').setCurrentTime?.(paused?0:0);document.querySelectorAll('animate').forEach(a=>paused?a.pauseAnimations?.():a.unpauseAnimations?.());const s=document.querySelector('svg');if(paused)s.pauseAnimations();else s.unpauseAnimations();button.textContent=paused?'Play animation':'Pause animation';});
</script></body></html>
